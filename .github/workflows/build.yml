name: Workflow Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Lint (Checkstyle)
        run: mvn checkstyle:check --batch-mode
        working-directory: atelier-backend

      - name: Build, test, and generate coverage
        run: mvn clean verify jacoco:report --batch-mode -Dspring.profiles.active=ci
        working-directory: atelier-backend

      - name: Upload backend coverage
        uses: codecov/codecov-action@v5
        with:
          files: atelier-backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: atelier-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: atelier-frontend

      - name: Lint
        run: npm run lint
        working-directory: atelier-frontend

      - name: Test with coverage
        run: npm test -- --coverage
        working-directory: atelier-frontend

      - name: Build
        run: npm run build
        working-directory: atelier-frontend
